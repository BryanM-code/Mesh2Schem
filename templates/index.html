<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BuildDataCollector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&#9632;</span>
      <span class="brand-name">BuildDataCollector</span>
    </div>
    <nav class="nav">
      <a href="#add" data-nav="add">Add New Build</a>
      <a href="#library" data-nav="library">Library</a>
    </nav>
  </header>

  <main id="view" class="view"></main>

  <div id="toast" class="toast" hidden></div>

  <!-- View templates (cloned by app.js) -->
  <template id="tpl-add">
    <section class="panel">
      <h1 class="panel-title">Add New Build</h1>
      <p class="panel-sub">Drop one schematic to review it, or several to add a batch. Older <code>.schematic</code> files are converted to <code>.schem</code> automatically, and a Bedrock <code>.mcworld</code> or a zipped Java world opens a map you can cut a build out of. Dropping one file lets you crop it; dropping several adds them as a batch. Every file is checked before it&rsquo;s read, and your originals are only ever copied &mdash; never moved or deleted.</p>
      <div class="dropzone" data-drop="schem">
        <div class="dropzone-inner">
          <div class="dropzone-icon">&#8681;</div>
          <div class="dropzone-text"><strong>Drop a .schem, .mcworld or a zipped world here</strong></div>
          <div class="dropzone-hint">or click to browse</div>
        </div>
        <input type="file" accept=".schem,.schematic,.mcworld,.zip" multiple hidden>
      </div>
      <div id="add-work"></div>
    </section>
  </template>

  <template id="tpl-library">
    <section class="panel">
      <div class="panel-head">
        <div>
          <h1 class="panel-title">Library</h1>
          <p class="panel-sub" id="lib-summary">&nbsp;</p>
        </div>
        <div class="panel-actions">
          <div class="view-toggle" role="group" aria-label="Library layout">
            <button class="vt-btn" data-view="grid" title="Thumbnail grid">Grid</button>
            <button class="vt-btn" data-view="table" title="Detailed table">Table</button>
          </div>
          <a id="btn-export" class="btn" href="/api/export.csv">Export CSV</a>
          <button id="btn-scan" class="btn btn-ghost" title="Recover download URLs from your original files">Find sources</button>
          <button id="btn-rebuild" class="btn btn-ghost" title="Re-derive rows from data/builds/ on disk">Rebuild from disk</button>
        </div>
      </div>

      <div id="scan-panel" class="scan-panel" hidden></div>

      <div class="filters">
        <input type="search" id="f-q" class="input" placeholder="Search name, notes, source or #number&hellip;">
        <select id="f-status" class="input">
          <option value="">All statuses</option>
          <option value="needs_image">Needs AI image</option>
          <option value="needs_trellis">Needs TRELLIS</option>
          <option value="complete">Complete</option>
        </select>
        <label class="f-axis">Longest axis &le;
          <input type="number" id="f-maxlong" class="input input-num" min="1" placeholder="&#8734;">
        </label>
        <label class="f-axis">&ge;
          <input type="number" id="f-minlong" class="input input-num" min="1" placeholder="0">
        </label>
        <button id="f-clear" class="btn btn-ghost btn-sm">Clear</button>
      </div>

      <!-- Two layouts over the same fetched list; app.js shows one and hides the other. -->
      <div id="lib-cards" class="card-grid"></div>

      <div class="table-wrap">
        <table class="grid">
          <thead>
            <tr>
              <th data-sort="id" class="sortable num" title="Build number">#</th>
              <th data-sort="name" class="sortable">Name</th>
              <th data-sort="longest" class="sortable num">Dims (W&times;H&times;L)</th>
              <th data-sort="status" class="sortable">Status</th>
              <th>Source</th>
              <th data-sort="added_at" class="sortable">Added</th>
            </tr>
          </thead>
          <tbody id="lib-rows"></tbody>
        </table>
      </div>
      <div id="lib-empty" class="empty" hidden></div>
    </section>
  </template>

  <template id="tpl-detail">
    <section class="panel">
      <a href="#library" class="back">&#8592; Back to Library</a>
      <div id="detail-body"><div class="empty">Loading&hellip;</div></div>
    </section>
  </template>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
